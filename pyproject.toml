[project]
name = "knowledgenexus"
version = "0.1.0"
description = "Modular monolith RAG platform — foundation / indexing / retrieval / chat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "qdrant-client>=1.12",
]

[project.optional-dependencies]
embedding = [
    "FlagEmbedding>=1.2.10",
    "torch",
    "numpy",
]

[project.scripts]
knowledgenexus = "knowledgenexus.main:main"
kn-foundation = "knowledgenexus.foundation.cli.main:main"
kn-indexer = "knowledgenexus.indexing.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledgenexus"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.27",
    "numpy>=1.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
