services:
  qdrant:
    image: qdrant/qdrant:v1.12.6
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - knowledgenexus

  api:
    image: knowledgenexus-api:latest
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - .env
      - .env.docker
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      # Mount models from external location (D:/KnowledgeNexus_Models)
      - D:/KnowledgeNexus_Models:/app/models:ro
      - sqlite_db:/app/data/index
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - knowledgenexus

  mcp:
    image: knowledgenexus-mcp:latest
    build:
      context: .
      dockerfile: docker/mcp/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      KNOWLEDGENEXUS_API_URL: http://api:8000
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8787
    ports:
      - "8787:8787"
    networks:
      - knowledgenexus

networks:
  knowledgenexus:

volumes:
  qdrant_storage:
  sqlite_db:
